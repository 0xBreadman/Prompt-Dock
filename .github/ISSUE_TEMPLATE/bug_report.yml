name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴私人 Prompt、API Key、客户数据或包含这些内容的截图。
  - type: dropdown
    id: area
    attributes:
      label: 功能区域
      options:
        - 悬浮面板
        - Prompt 管理
        - 工作预设
        - 按键转盘
        - 屏幕边缘栏
        - 导入与导出
        - 其他
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 26.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请用通用示例内容描述操作顺序
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 可附已脱敏的截图或日志。
