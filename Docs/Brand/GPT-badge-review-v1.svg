<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F8"/>
      <stop offset="1" stop-color="#ECEDEF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24272A"/>
      <stop offset="0.56" stop-color="#151719"/>
      <stop offset="1" stop-color="#0B0C0D"/>
    </linearGradient>
    <linearGradient id="badgeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34383B"/>
      <stop offset="0.6" stop-color="#1A1D1F"/>
      <stop offset="1" stop-color="#101112"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65C7B2"/>
      <stop offset="1" stop-color="#A1E3D4"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#page)"/>

  <text x="72" y="82" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="30" font-weight="700" fill="#161719">GPT 预设徽章</text>
  <text x="72" y="116" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="500" fill="#73777C">V1 · 缩写优先 · 不使用官方花结 · Light / Dark 自适应</text>

  <g filter="url(#cardShadow)">
    <rect x="72" y="160" width="486" height="500" rx="32" fill="#FFFFFF"/>
  </g>
  <text x="108" y="212" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="650" fill="#8A8E93" letter-spacing="1.6">LIGHT</text>

  <g transform="translate(108 250)" filter="url(#badgeShadow)">
    <rect width="136" height="136" rx="40" fill="url(#badge)"/>
    <rect x="0.75" y="0.75" width="134.5" height="134.5" rx="39.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="68" y="78" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="42" font-weight="720" letter-spacing="-1.8" fill="#F7F7F5">GPT</text>
    <rect x="49" y="103" width="38" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <text x="274" y="288" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="25" font-weight="700" fill="#17191B">GPT</text>
  <text x="274" y="319" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#777B80">石墨底色，薄荷色识别线</text>
  <text x="274" y="345" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#777B80">只保留一个视觉焦点</text>

  <line x1="108" y1="428" x2="522" y2="428" stroke="#E9EAEC"/>
  <text x="108" y="468" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="650" fill="#9A9DA1" letter-spacing="1.4">IN PRESET LIST</text>
  <rect x="108" y="493" width="414" height="112" rx="22" fill="#F4F4F5" stroke="#E8E8EA"/>

  <g transform="translate(128 513)">
    <rect width="72" height="72" rx="22" fill="url(#badge)"/>
    <rect x="0.75" y="0.75" width="70.5" height="70.5" rx="21.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="36" y="42" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="22" font-weight="720" letter-spacing="-0.9" fill="#F7F7F5">GPT</text>
    <rect x="25" y="55" width="22" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
  <text x="220" y="535" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#17191B">GPT 图片工作流</text>
  <text x="220" y="563" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#777B80">产品图 · UGC · 改图</text>
  <rect x="431" y="526" width="65" height="30" rx="15" fill="#FFFFFF"/>
  <text x="463.5" y="546" text-anchor="middle" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="12" font-weight="650" fill="#777B80">12 项</text>

  <g filter="url(#cardShadow)">
    <rect x="594" y="160" width="534" height="500" rx="32" fill="#17191B"/>
  </g>
  <text x="630" y="212" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="650" fill="#858A8F" letter-spacing="1.6">DARK</text>

  <g transform="translate(630 250)" filter="url(#badgeShadow)">
    <rect width="136" height="136" rx="40" fill="url(#badgeDark)"/>
    <rect x="0.75" y="0.75" width="134.5" height="134.5" rx="39.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="1.5"/>
    <text x="68" y="78" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="42" font-weight="720" letter-spacing="-1.8" fill="#F7F7F5">GPT</text>
    <rect x="49" y="103" width="38" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <text x="796" y="288" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="25" font-weight="700" fill="#F3F4F4">GPT</text>
  <text x="796" y="319" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#94999E">暗色环境提高边缘分离度</text>
  <text x="796" y="345" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#94999E">字标和识别线保持一致</text>

  <line x1="630" y1="428" x2="1092" y2="428" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="630" y="468" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="650" fill="#777C81" letter-spacing="1.4">COMPACT SIZES</text>

  <g transform="translate(630 502)">
    <rect width="64" height="64" rx="20" fill="url(#badgeDark)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="32" y="38" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="20" font-weight="720" letter-spacing="-0.8" fill="#F7F7F5">GPT</text>
    <rect x="22" y="49" width="20" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <g transform="translate(724 510)">
    <rect width="48" height="48" rx="15" fill="url(#badgeDark)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="720" letter-spacing="-0.6" fill="#F7F7F5">GPT</text>
    <rect x="17" y="37" width="14" height="2.5" rx="1.25" fill="url(#accent)"/>
  </g>

  <g transform="translate(802 518)">
    <rect width="32" height="32" rx="10" fill="url(#badgeDark)"/>
    <rect x="0.5" y="0.5" width="31" height="31" rx="9.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="16" y="20" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, sans-serif" font-size="10.5" font-weight="720" letter-spacing="-0.45" fill="#F7F7F5">GPT</text>
    <rect x="11" y="25" width="10" height="2" rx="1" fill="url(#accent)"/>
  </g>

  <rect x="630" y="592" width="462" height="1" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="638" cy="625" r="4" fill="#82D7C4"/>
  <text x="652" y="630" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#92979C">未来所有模型只替换缩写与一条识别色</text>

  <text x="72" y="730" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#7C8085">Prompt Dock · Provider Badge System</text>
  <text x="1128" y="730" text-anchor="end" font-family="SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#A2A5A9">01 / GPT</text>
</svg>
